<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notiz App</title>
  </head>
  <body>
    <div class="notes-app">
      <div class="sidebar">
        <button class="create-new">Neue Notiz erstellen</button>
        <div class="notes-list"></div>
      </div>
      <div class="main-content">
        <input type="text" class="title-input" />
        <button class="save-note"></button>
        <button class="delete-note"></button>
        <textarea id="content-input"></textarea>
      </div>
    </div>
  </body>
</html>
